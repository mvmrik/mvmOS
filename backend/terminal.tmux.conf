# tmux here only keeps terminal sessions alive across dropped connections;
# it should otherwise stay out of sight: no status bar, no prefix key, and no
# alternate screen, so the browser terminal keeps its own scrollback and
# mouse selection.
set -g status off
set -g prefix None
unbind C-b
set -g history-limit 5000
set -g default-terminal "xterm-256color"
set -g escape-time 0
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'
