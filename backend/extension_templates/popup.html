<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow:hidden;background:#1e1e2e;color:#cdd6f4;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;min-width:0}#bar{height:36px;display:flex;align-items:center;gap:8px;padding:0 9px;background:#181825;border-bottom:1px solid #313244;flex-shrink:0;min-width:0}
#icon{font-size:17px}#name{font-size:12px;font-weight:700;white-space:nowrap}#server{font-size:11px;color:#a6adc8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:right}
#settings{background:none;border:0;color:#a6adc8;cursor:pointer;font-size:16px;padding:3px}#settings:hover{color:#89b4fa}
#frame{border:0;width:100%;max-width:100%;min-width:0;height:564px;background:#1e1e2e;display:block}#error{display:none;padding:24px;text-align:center;color:#f38ba8;font-size:13px}
</style></head><body>
<div id="bar"><span id="icon"></span><span id="name"></span><span id="server"></span><button id="settings">⚙</button></div>
<iframe id="frame" allow="clipboard-read; clipboard-write"></iframe><div id="error"></div>
<script src="config.js"></script><script src="popup.js"></script><!--APP_SCRIPTS--></body></html>
