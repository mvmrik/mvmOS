<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apps Hub</title>
<link rel="manifest" href="/pub/apphub/manifest.webmanifest">
<link rel="apple-touch-icon" href="/pub/apphub/icon-192.png">
<meta name="theme-color" content="#1e1e2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#1e1e2e;--surface1:#181825;--surface2:#313244;--border:#45475a;--fg:#cdd6f4;--fg2:#a6adc8;--accent:#89b4fa;--green:#a6e3a1;--red:#f38ba8;--yellow:#f9e2af}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100dvh;display:flex;flex-direction:column}
  #app{flex:1;display:flex;flex-direction:column}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  .card{background:var(--surface1);border:1px solid var(--border);border-radius:12px}
  .btn{border:none;border-radius:8px;padding:9px 20px;font-size:.9rem;font-weight:600}
  .btn-primary{background:var(--accent);color:#1e1e2e}
  .btn-primary:hover{opacity:.9}
  .btn-secondary{background:var(--surface2);color:var(--fg);border:1px solid var(--border)}
  .btn-secondary:hover{background:var(--border)}
  .inp{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--fg);font-size:.9rem;width:100%;outline:none}
  .inp:focus{border-color:var(--accent)}
  .err{color:var(--red);font-size:.82rem;min-height:18px}
  .tab-bar{display:flex;gap:6px;border-bottom:1px solid var(--border);padding:0 16px;flex-shrink:0;min-width:0}
  .tab{flex:1;min-width:0;background:none;border:none;padding:10px 14px;font-size:.88rem;color:var(--fg2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab.active{color:var(--accent);border-color:var(--accent)}
  .tab:hover:not(.active){color:var(--fg)}
  .tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:middle}
  .tab-dot[hidden]{display:none}
  .subtabs{display:flex;flex-wrap:wrap;gap:6px}
  .subtab{background:var(--surface2);border:1px solid var(--border);color:var(--fg2);border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:600}
  .subtab.active{background:var(--accent);border-color:var(--accent);color:#1e1e2e}
  .subtab:hover:not(.active){color:var(--fg)}
  .aud-opt{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:10px;border:2px solid var(--border);cursor:pointer}
  .aud-opt.active{border-color:var(--accent)}
  .aud-opt small{display:block;color:var(--fg2);margin-top:3px;font-size:.78rem}
  .section{padding:16px}
  .app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:16px}
  .app-card{position:relative;background:var(--surface1);border:1px solid var(--border);border-radius:12px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:background .12s,border-color .12s;text-decoration:none;color:var(--fg)}
  .app-card:hover{background:var(--surface2);border-color:var(--accent)}
  .app-icon{font-size:2.2rem;line-height:1;position:relative}
  .app-badge{position:absolute;top:-2px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--surface1)}
  .app-name{font-size:.85rem;font-weight:600;text-align:center}
  #apps-grid .app-card{padding:14px 10px;min-height:96px;justify-content:center}
  #apps-grid .app-name{line-height:1.25;overflow-wrap:anywhere}
  .app-desc{font-size:.72rem;color:var(--fg2);text-align:center;line-height:1.4}
  .st-row{display:flex;align-items:flex-start;gap:12px;background:var(--surface1);border:1px solid var(--border);border-radius:12px;padding:14px}
  .st-row .app-icon{font-size:1.8rem}
  .st-info{flex:1;min-width:0}
  .st-info .app-name{text-align:left;margin-bottom:3px}
  .st-info .app-desc{text-align:left}
  .st-btn{border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:600;flex-shrink:0;border:1px solid var(--border);background:var(--surface2);color:var(--fg)}
  .st-btn.add{background:var(--accent);color:#1e1e2e;border-color:transparent}
  .st-btn:hover{opacity:.85}
  .st-btn:disabled{opacity:.45;cursor:default}
  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#1e1e2e;flex-shrink:0}
  @media(max-width:600px){.tab-bar{gap:2px;padding:0 6px}.tab{padding:10px 4px;font-size:.82rem}#apps-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px}#apps-grid .app-card{min-height:84px;padding:10px 5px;gap:6px}#apps-grid .app-icon{font-size:1.8rem}#apps-grid .app-name{font-size:.73rem;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}}
</style>
</head>
<body>
<div id="app"></div>
<button id="pwa-install" hidden style="position:fixed;right:16px;bottom:16px;z-index:20;border:0;border-radius:999px;padding:10px 16px;background:var(--accent);color:#1e1e2e;font-weight:700;box-shadow:0 4px 16px #0008"></button>
<script src="/i18n/i18n.js"></script>
<script src="/pub/apphub/avatar.js"></script>
<script>
let _installPrompt;
const installButton = document.getElementById('pwa-install');
(window.mvmOS?.i18nReady || Promise.resolve()).then(() => { installButton.textContent = t('ah_pwa_install'); });
window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); _installPrompt=event; installButton.hidden=false; });
installButton.onclick=async()=>{
  if (!_installPrompt)return;
  _installPrompt.prompt(); await _installPrompt.userChoice; _installPrompt=null; installButton.hidden=true;
};
window.addEventListener('appinstalled',()=>installButton.hidden=true);
if('serviceWorker' in navigator) navigator.serviceWorker.register('/pub/apphub/sw.js').catch(()=>{});
const BASE = '/api/pub/apphub';
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

let _me = null;
const _params = new URLSearchParams(location.search);
// localStorage is per-origin, so an installation reachable over both http and
// https hides the token from whichever scheme the user did not log in on. The
// cookie the server sets alongside the token is not tied to the scheme, so it
// is what a fresh origin falls back to before deciding nobody is logged in.
function _cookieToken() {
  const m = document.cookie.match(/(?:^|;\s*)apphub_token=([^;]*)/);
  try { return m ? decodeURIComponent(m[1]) : null; } catch(_) { return null; }
}
function _dropToken() {
  _token = null;
  localStorage.removeItem('apphub_token');
  document.cookie = 'apphub_token=; Max-Age=0; Path=/';
}
let _token = _params.get('token') || localStorage.getItem('apphub_token') || _cookieToken();
const _invitation = _params.get('invitation') || '';
let _hubName = 'Apps Hub';
const _startTab = _params.get('tab') || 'apps';
// Optional return URL: another app sends the user here to log in, then we send them back.
// Only same-origin relative paths are honoured, to avoid open-redirects.
const _returnTo = (() => {
  const r = _params.get('return');
  if (r && r.startsWith('/') && !r.startsWith('//')) return r;
  return null;
})();
if (_token) { localStorage.setItem('apphub_token', _token); history.replaceState(null,'',location.pathname); }

// Called after any successful authentication. If we were sent here to log in
// on behalf of another app, bounce straight back to it.
function _afterAuth() {
  if (_returnTo) { location.replace(_returnTo); return true; }
  return false;
}

const app = document.getElementById('app');
const t = (key, vars) => (window.t ? window.t(key, vars) : key);

async function boot() {
  app.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--fg2);font-size:.9rem">${t('ah_pub_loading')}</div>`;
  if (_token) {
    try {
      let r = await fetch(BASE + '/me', {headers:{'X-Pub-Token':_token}});
      // A token out of localStorage can be stale: logging out on the other
      // scheme revokes it server-side but cannot reach this origin's storage.
      // The cookie is the only thing that crosses, so it gets the second try
      // instead of the stale entry deciding that nobody is logged in.
      if (!r.ok) {
        const ck = _cookieToken();
        if (ck && ck !== _token) {
          const r2 = await fetch(BASE + '/me', {headers:{'X-Pub-Token':ck}});
          if (r2.ok) { _token = ck; localStorage.setItem('apphub_token', ck); r = r2; }
        }
      }
      if (r.ok) _me = await r.json();
      else _dropToken();
    } catch(_) { _dropToken(); }
  }
  try {
    const branding = await fetch(BASE + '/branding').then(r => r.json());
    _hubName = branding.names?.apphub || 'Apps Hub';
    document.title = _hubName;
  } catch (_) {}
  if (!_me) showAuth(_invitation ? 'register' : 'login');
  else if (_afterAuth()) return;
  else { await _loadPrefs(); showDashboard(_startTab); }
}

// ── Auth ────────────────────────────────────────────────────────

async function showAuth(tab) {
  tab = tab || 'login';
  let regAllowed = false;
  try {
    const r = await fetch(BASE + '/registration?invitation=' + encodeURIComponent(_invitation));
    if (r.ok) regAllowed = !!(await r.json()).allowed;
  } catch (_) {}
  if (!regAllowed) tab = 'login';
  app.innerHTML = `
    <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px">
      <div class="card" style="width:100%;max-width:360px;padding:28px;display:flex;flex-direction:column;gap:18px">
        <div style="text-align:center">
          <div style="font-size:2.5rem">🧩</div>
          <div style="font-weight:700;font-size:1.2rem;margin-top:6px">${esc(_hubName)}</div>
          <div style="font-size:.82rem;color:var(--fg2);margin-top:4px">${t('ah_pub_tagline')}</div>
          ${_invitation && !regAllowed ? `<div class="err">${t('ah_invitation_invalid')}</div>` : ''}
        </div>
        ${regAllowed ? `
        <div style="display:flex;gap:0;background:var(--surface2);border-radius:8px;padding:3px">
          <button id="a-login" style="flex:1;border:none;border-radius:6px;padding:7px;font-size:.88rem;font-weight:600;background:${tab==='login'?'var(--surface1)':'transparent'};color:${tab==='login'?'var(--fg)':'var(--fg2)'}">${t('ah_pub_log_in')}</button>
          <button id="a-reg"   style="flex:1;border:none;border-radius:6px;padding:7px;font-size:.88rem;font-weight:600;background:${tab==='register'?'var(--surface1)':'transparent'};color:${tab==='register'?'var(--fg)':'var(--fg2)'}">${t('ah_register')}</button>
        </div>` : ''}
        <div id="a-form"></div>
      </div>
    </div>`;
  if (regAllowed) {
    app.querySelector('#a-login').onclick = () => { renderLoginForm(); _setAuthTab('login'); };
    app.querySelector('#a-reg').onclick   = () => { renderRegForm();   _setAuthTab('register'); };
  }
  if (regAllowed && tab === 'register') renderRegForm(); else renderLoginForm();
}

function _setAuthTab(t) {
  const l = app.querySelector('#a-login'), r = app.querySelector('#a-reg');
  l.style.background = t==='login'    ? 'var(--surface1)' : 'transparent';
  l.style.color      = t==='login'    ? 'var(--fg)'       : 'var(--fg2)';
  r.style.background = t==='register' ? 'var(--surface1)' : 'transparent';
  r.style.color      = t==='register' ? 'var(--fg)'       : 'var(--fg2)';
}

function renderLoginForm() {
  const f = app.querySelector('#a-form');
  f.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px">
      <input class="inp" id="a-user" placeholder="${t('ah_username_ph')}" autocomplete="username">
      <input class="inp" id="a-pass" type="password" placeholder="${t('ah_password_ph')}" autocomplete="current-password">
      <div class="err" id="a-err"></div>
      <button class="btn btn-primary" id="a-sub">${t('ah_pub_log_in')}</button>
    </div>`;
  const sub = async () => {
    const u = f.querySelector('#a-user').value.trim();
    const p = f.querySelector('#a-pass').value;
    if (!u || !p) return;
    f.querySelector('#a-sub').disabled = true;
    const r = await fetch(BASE + '/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    if (r.ok) {
      const d = await r.json(); _token = d.token; _me = d.user;
      localStorage.setItem('apphub_token', _token);
      history.replaceState(null, '', location.pathname);
      _me = await fetch(BASE + '/me', {headers:{'X-Pub-Token':_token}}).then(r => r.ok ? r.json() : _me).catch(() => _me);
      if (_afterAuth()) return;
      await _loadPrefs();
      showDashboard();
    } else {
      const d = await r.json().catch(()=>({}));
      f.querySelector('#a-err').textContent = d.detail || t('ah_pub_invalid_credentials');
      f.querySelector('#a-sub').disabled = false;
    }
  };
  f.querySelector('#a-sub').onclick = sub;
  f.querySelector('#a-pass').onkeydown = e => { if(e.key==='Enter') sub(); };
  setTimeout(() => f.querySelector('#a-user').focus(), 50);
}

function renderRegForm() {
  const f = app.querySelector('#a-form');
  f.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px">
      <input class="inp" id="a-dname" placeholder="${t('ah_display_name_ph')}">
      <input class="inp" id="a-user"  placeholder="${t('ah_pub_username_letters_ph')}" autocomplete="username">
      <input class="inp" id="a-pass"  type="password" placeholder="${t('ah_password_min_ph')}" autocomplete="new-password">
      <div class="err" id="a-err"></div>
      <button class="btn btn-primary" id="a-sub">${t('ah_create_account')}</button>
    </div>`;
  f.querySelector('#a-sub').onclick = async () => {
    const dn = f.querySelector('#a-dname').value.trim();
    const un = f.querySelector('#a-user').value.trim();
    const pw = f.querySelector('#a-pass').value;
    if (!dn || !un || !pw) { f.querySelector('#a-err').textContent = t('ah_fill_all_fields'); return; }
    f.querySelector('#a-sub').disabled = true;
    const r = await fetch(BASE + '/register', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({display_name:dn,username:un,password:pw,invitation:_invitation})});
    if (r.ok) {
      const d = await r.json(); _token = d.token; _me = d.user;
      localStorage.setItem('apphub_token', _token);
      history.replaceState(null, '', location.pathname);
      _me = await fetch(BASE + '/me', {headers:{'X-Pub-Token':_token}}).then(r => r.ok ? r.json() : _me).catch(() => _me);
      if (_afterAuth()) return;
      await _loadPrefs();
      showDashboard();
    } else {
      const d = await r.json().catch(()=>({}));
      f.querySelector('#a-err').textContent = d.detail === 'registration_invitation_invalid' ? t('ah_invitation_invalid') : d.detail === 'registration_disabled' ? t('ah_registration_failed') : d.detail || t('ah_registration_failed');
      f.querySelector('#a-sub').disabled = false;
    }
  };
  setTimeout(() => f.querySelector('#a-dname').focus(), 50);
}

// ── Dashboard ───────────────────────────────────────────────────

let _activeTab = 'apps';
let _feedView = null;     // the mounted Community feed, while that tab is open
let _feedUnseen = 0;      // posts others shared since this account last looked
let _feedPoll = null;
let _settingsSection = 'appearance';

function showDashboard(activeTab) {
  activeTab = _activeTab = activeTab || 'apps';
  app.innerHTML = `
    <div class="tab-bar">
      <button class="tab${activeTab==='apps'?' active':''}" data-t="apps">${t('ah_pub_tab_apps')}</button>
      <button class="tab${activeTab==='community'?' active':''}" data-t="community">${t('feed_tab')}<span class="tab-dot" id="feed-dot"${_feedUnseen && activeTab!=='community' ? '' : ' hidden'}></span></button>
      <button class="tab${activeTab==='store'?' active':''}" data-t="store">${t('ah_pub_tab_store')}</button>
    </div>
    <div id="d-body" style="flex:1;overflow-y:auto"></div>`;

  window.MvmLayout && MvmLayout.refresh();
  app.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      _markTab(t.dataset.t);
      renderTab(t.dataset.t);
    };
  });
  renderTab(activeTab);
  _startFeedPoll();
}

// A language change (Settings tab, applied live by layout.js without a full
// page reload) re-fires this once the new i18n table has loaded, so the tab
// bar / whatever tab is open picks up the new language immediately instead
// of needing a manual refresh. Auth screens have no i18n-driven chrome that
// survives a rebuild worth doing here, so this only matters once logged in.
window.addEventListener('i18n-loaded', () => {
  if (_me && app.querySelector('.tab-bar')) showDashboard(_activeTab);
});

function renderTab(t) {
  clearInterval(_badgePoll);
  if (_feedView) { _feedView.destroy(); _feedView = null; }
  const c = app.querySelector('#d-body');
  // The API used to be a tab of its own; it now lives in Settings, and old
  // links to ?tab=api land there.
  if (t === 'api') { _settingsSection = 'api'; t = 'settings'; _markTab('settings'); }
  // Credits exist only where the installation is licensed. Without it the tab
  // is not hidden behind a lock — it is not a place you can get to at all, so
  // even ?tab=credits typed by hand just lands on the app list.
  if (t === 'credits' && !(_me && _me.credits)) t = 'apps';
  // Same for the External API: without it, or with no app open to it, there
  // is no tab to reach.
  if (t === 'api' && !(_me && _me.api)) t = 'apps';
  if (t === 'invitations' && !(_me && _me.invitations)) t = 'apps';
  if (t === 'apps')       renderApps(c);
  if (t === 'community')  renderCommunity(c);
  if (t === 'store')      renderStore(c);
  if (t === 'favourites') renderFavourites(c);
  if (t === 'credits')    renderCredits(c);
  if (t === 'invitations') renderInvitations(c);
  if (t === 'profile')    renderProfile(c);
  if (t === 'settings')   renderSettings(c);
}

// Lets layout.js's avatar-menu links (Credits/Profile/Settings — no longer
// in the tab bar itself) switch tabs in place instead of reloading the page,
// same as a real tab-bar button click. Only exists once the dashboard is up,
// so layout.js's header only wires this up when it finds it — a plain page
// load otherwise, which is what apps other than apphub itself need anyway.
window.MvmApphub = {
  goToTab(tab) {
    if (!_me || !app.querySelector('.tab-bar')) return;
    _markTab(tab);
    renderTab(tab);
  }
};

function _markTab(tab) {
  app.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.t === tab));
  _activeTab = tab;
  _setFeedDot(_feedUnseen);
}

// ── Apps tab ────────────────────────────────────────────────────

// View preferences (sort order, selected category) belong to the Apps Hub
// account, not to the browser: the same person on a phone and on a laptop was
// getting two different orderings because these used to live in localStorage.
// They are loaded once at boot and written back on every change.
let _prefs = {};

async function _loadPrefs() {
  if (!_token) return;
  try {
    const r = await fetch(BASE + '/prefs', {headers:{'X-Pub-Token':_token}});
    if (r.ok) _prefs = await r.json() || {};
  } catch(_) {}
  // One-time lift of whatever this browser had stored before the move, so an
  // existing user keeps their ordering instead of silently falling back to A-Z.
  const legacy = {apps_sort: localStorage.getItem('apphub_apps_sort'),
                  apps_category: localStorage.getItem('apphub_apps_category')};
  for (const [key, value] of Object.entries(legacy)) {
    if (value && !_prefs[key]) _setPref(key, value);
  }
  localStorage.removeItem('apphub_apps_sort');
  localStorage.removeItem('apphub_apps_category');
}

function _setPref(key, value) {
  if (_prefs[key] === value) return;
  _prefs[key] = value;
  if (!_token) return;
  fetch(BASE + '/prefs', {
    method: 'PUT',
    headers: {'Content-Type':'application/json', 'X-Pub-Token':_token},
    body: JSON.stringify({[key]: value})
  }).catch(() => {});
}

// Usage (open_count / last_opened_at) lives server-side per Apps Hub
// account so recent/frequent sorting agrees across every device.
function _recordUsage(id) {
  if (!_token) return;
  // The card is a plain <a href>, so the click that calls this navigates away
  // immediately and the browser cancels whatever is still in flight — which is
  // why the counter stayed at zero however often an app was opened. keepalive
  // lets the request outlive the page; sendBeacon cannot be used here because
  // it has no way to send the X-Pub-Token header.
  fetch(BASE + '/apps/' + encodeURIComponent(id) + '/open', {
    method: 'POST', headers: {'X-Pub-Token': _token}, keepalive: true
  }).catch(() => {});
}

function _getSortPref() { return _prefs.apps_sort || 'alpha'; }
function _setSortPref(v) { _setPref('apps_sort', v); }
function _getCategoryPref(categories) {
  const value = _prefs.apps_category || 'all';
  return value === 'all' || categories.includes(value) ? value : 'all';
}
function _setCategoryPref(v) { _setPref('apps_category', v); }

// Names and categories in the viewer's language; an owner's own public name
// arrives without translations and stays as written.
const _appName = a => (window.mvmOS?.appName ? mvmOS.appName(a) : a.name);
const _catName = c => (window.mvmOS?.categoryName ? mvmOS.categoryName(c) : c);

function _sortApps(apps, mode) {
  const sorted = apps.slice();
  if (mode === 'recent') {
    sorted.sort((a, b) => new Date(b.last_opened_at || 0) - new Date(a.last_opened_at || 0));
  } else if (mode === 'frequent') {
    sorted.sort((a, b) => (b.open_count || 0) - (a.open_count || 0));
  } else {
    sorted.sort((a, b) => _appName(a).localeCompare(_appName(b)));
  }
  return sorted;
}

async function _loadBadges() {
  if (!_token) return {};
  try {
    const r = await fetch('/api/notifications/badges', {headers:{'X-Pub-Token':_token}});
    return r.ok ? await r.json() : {};
  } catch(_) { return {}; }
}

// This is a static page with no websocket/live-push channel of its own, so
// badge state (which apps have unread notifications) can only go stale —
// poll it periodically while the Apps tab is open instead of requiring a
// full page reload to see a badge appear or disappear.
let _badgePoll = null;

// Both the Apps tab and the Store tab describe the same list — one shows what
// the account keeps on its home screen, the other everything on offer — so it
// is fetched once and re-used, and an install/uninstall just flips the flag in
// place instead of costing a round trip on every tab switch.
let _apps = null;

async function _loadApps(force) {
  if (_apps && !force) return _apps;
  try {
    // With the token, /apps answers with this account's usage and installed
    // flag; without it the server has no identity for those preferences.
    const r = await fetch(BASE + '/apps', _token ? {headers: {'X-Pub-Token': _token}} : undefined);
    _apps = r.ok ? await r.json() : [];
  } catch(_) { _apps = []; }
  return _apps;
}

async function renderApps(c) {
  c.innerHTML = `<div style="padding:32px;text-align:center;color:var(--fg2);font-size:.9rem">${t('ah_pub_loading_apps')}</div>`;
  const all = await _loadApps();
  // The home screen shows only what this account added from the Store. A
  // visitor without a session has no shelf of their own, so they get the lot.
  const apps = _token ? all.filter(a => a.installed) : all;
  let badges = await _loadBadges();

  if (!apps.length) {
    c.innerHTML = `<div style="padding:40px;text-align:center;color:var(--fg2)">
      <div style="font-size:2rem;margin-bottom:10px">📭</div>
      <div>${all.length && _token ? t('ah_pub_no_installed_apps') : t('ah_pub_no_apps_yet')}</div>
      ${all.length && _token ? `<button class="btn" id="apps-to-store" style="margin-top:14px">${t('ah_pub_open_store')}</button>` : ''}
    </div>`;
    const go = c.querySelector('#apps-to-store');
    if (go) go.onclick = () => MvmApphub.goToTab('store');
    return;
  }

  const categories = [...new Set(apps.map(a => a.category || 'Utilities'))].sort((a, b) => _catName(a).localeCompare(_catName(b)));
  const categoryMode = _getCategoryPref(categories);
  c.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:flex-start;gap:8px;padding:12px 16px 0;flex-wrap:wrap">
      <select class="inp" id="apps-category" aria-label="${esc(t('ah_apps_category'))}" title="${esc(t('ah_apps_category'))}" style="width:auto;padding:5px 10px;font-size:.8rem">
        <option value="all">${t('ah_apps_all_categories')}</option>
        ${categories.map(category => `<option value="${esc(category)}"${categoryMode===category?' selected':''}>${esc(_catName(category))}</option>`).join('')}
      </select>
    </div>
    <div class="app-grid" id="apps-grid"></div>`;

  const renderGrid = () => {
    const selectedCategory = _getCategoryPref(categories);
    const filtered = selectedCategory === 'all' ? apps : apps.filter(a => (a.category || 'Utilities') === selectedCategory);
    const sorted = _sortApps(filtered, _getSortPref());
    c.querySelector('#apps-grid').innerHTML = sorted.map(a => `
      <a class="app-card" href="${esc(a.public_url)}" data-id="${esc(a.id)}">
        <div class="app-icon">${esc(a.icon)}${badges[a.id] ? '<span class="app-badge"></span>' : ''}</div>
        <div class="app-name">${esc(_appName(a))}</div>
      </a>`).join('');
    c.querySelectorAll('.app-card').forEach(el => {
      el.addEventListener('click', () => _recordUsage(el.dataset.id));
    });
  };
  renderGrid();

  c.querySelector('#apps-category').onchange = e => { _setCategoryPref(e.target.value); renderGrid(); };

  clearInterval(_badgePoll);
  _badgePoll = setInterval(async () => {
    if (!c.isConnected) { clearInterval(_badgePoll); return; }
    badges = await _loadBadges();
    c.querySelectorAll('.app-card').forEach(el => {
      const icon = el.querySelector('.app-icon');
      const dot = icon.querySelector('.app-badge');
      const shouldShow = !!badges[el.dataset.id];
      if (shouldShow && !dot) icon.insertAdjacentHTML('beforeend', '<span class="app-badge"></span>');
      if (!shouldShow && dot) dot.remove();
    });
  }, 8000);
}

// ── Store tab ───────────────────────────────────────────────────
// Not a real store: everything here is already installed on the server and
// available to every profile. Adding and removing only decides whether an app
// shows up on this account's home screen — no data is ever created or deleted
// by it, which is why "remove" never asks for a confirmation.

// Where the Store tab is standing: null = the category grid, a category name,
// or 'installed' — the flat list of everything this profile has added, which is
// the one place to take an app off the home screen without remembering which
// category it came from.
let _storeView = null;

async function _setInstalled(appId, installed) {
  const r = await fetch(`${BASE}/apps/${encodeURIComponent(appId)}/installed`, {
    method: 'PUT',
    headers: {'Content-Type':'application/json', 'X-Pub-Token':_token},
    body: JSON.stringify({installed})
  });
  if (!r.ok) throw new Error('save failed');
  const entry = (_apps || []).find(a => a.id === appId);
  if (entry) entry.installed = installed;
}

async function renderStore(c) {
  c.innerHTML = `<div style="padding:32px;text-align:center;color:var(--fg2);font-size:.9rem">${t('ah_pub_loading_apps')}</div>`;
  const apps = await _loadApps();

  if (!apps.length) {
    c.innerHTML = `<div style="padding:40px;text-align:center;color:var(--fg2)">
      <div style="font-size:2rem;margin-bottom:10px">📭</div>
      <div>${t('ah_pub_no_apps_yet')}</div>
    </div>`;
    return;
  }

  const categoryOf = a => a.category || 'Utilities';
  const categories = [...new Set(apps.map(categoryOf))].sort((a, b) => _catName(a).localeCompare(_catName(b)));
  if (_storeView && _storeView !== 'installed' && !categories.includes(_storeView)) _storeView = null;
  c.innerHTML = `
    <div style="padding:16px 16px 0;color:var(--fg2);font-size:.82rem;line-height:1.5">${t('ah_pub_store_hint')}</div>
    <div style="padding:12px 16px 0">
      <input class="inp" id="store-search" type="search" autocomplete="off"
        aria-label="${esc(t('ah_pub_store_search'))}" placeholder="${esc(t('ah_pub_store_search'))}">
    </div>
    <div id="store-content"></div>`;
  const content = c.querySelector('#store-content');
  const search = c.querySelector('#store-search');

  const drawCategories = () => {
    const added = apps.filter(a => a.installed).length;
    content.innerHTML = `
      <div style="padding:12px 16px 0">
        <button class="st-btn" id="store-installed"${added ? '' : ' disabled'}>${esc(t('ah_pub_store_installed_btn', {n: added}))}</button>
      </div>
      <div class="app-grid" id="store-grid"></div>`;
    content.querySelector('#store-installed').onclick = () => { _storeView = 'installed'; drawApps(); };
    content.querySelector('#store-grid').innerHTML = categories.map(category => {
      const inCategory = apps.filter(a => categoryOf(a) === category);
      const added = inCategory.filter(a => a.installed).length;
      return `
        <div class="app-card" data-cat="${esc(category)}">
          <div class="app-icon">📂</div>
          <div class="app-name">${esc(_catName(category))}</div>
          <div class="app-desc">${esc(t('ah_pub_store_cat_summary', {total: inCategory.length, added}))}</div>
        </div>`;
    }).join('');
    content.querySelectorAll('[data-cat]').forEach(el => {
      el.onclick = () => { _storeView = el.dataset.cat; drawApps(); };
    });
  };

  const drawRows = (rows, installedView, title, showBack) => {
    // The added list keeps showing an app after it is taken off, so the button
    // that just said "remove" can put it straight back — a redraw would make
    // the row vanish under the cursor and an accidental click unfixable.
    content.innerHTML = `
      ${showBack ? `<div style="padding:12px 16px 0"><button class="st-btn" id="store-back">${t('ah_pub_store_back')}</button></div>` : ''}
      ${title ? `<div style="padding:12px 16px;font-weight:600">${esc(title)}</div>` : ''}
      <div class="err" id="store-err" style="padding:0 16px"></div>
      <div style="display:flex;flex-direction:column;gap:10px;padding:0 16px 16px" id="store-list"></div>`;
    if (showBack) content.querySelector('#store-back').onclick = () => { _storeView = null; drawCategories(); };

    const list = content.querySelector('#store-list');
    list.innerHTML = rows.length ? rows.map(a => `
      <div class="st-row">
        <div class="app-icon">${esc(a.icon)}</div>
        <div class="st-info">
          <div class="app-name">${esc(_appName(a))}</div>
          <div class="app-desc">${esc(installedView || !showBack ? _catName(categoryOf(a)) : (a.description || ''))}</div>
        </div>
        <button class="st-btn${a.installed ? '' : ' add'}" data-app="${esc(a.id)}">
          ${a.installed ? t('ah_pub_store_remove') : t('ah_pub_store_add')}
        </button>
      </div>`).join('') : `<div style="padding:20px;text-align:center;color:var(--fg2)">${esc(t('no_results'))}</div>`;

    list.querySelectorAll('[data-app]').forEach(btn => {
      btn.onclick = async () => {
        const entry = apps.find(a => a.id === btn.dataset.app);
        const wanted = !entry.installed;
        btn.disabled = true;
        try {
          await _setInstalled(entry.id, wanted);
          // Adding an app has to make it appear, and the Apps tab keeps a
          // category filter of its own: an app added from another category
          // would land behind that filter and look like nothing happened.
          const category = categoryOf(entry);
          if (wanted && (_prefs.apps_category || 'all') !== 'all'
              && _prefs.apps_category !== category) {
            _setPref('apps_category', 'all');
          }
          btn.textContent = wanted ? t('ah_pub_store_remove') : t('ah_pub_store_add');
          btn.classList.toggle('add', !wanted);
        } catch (_) {
          content.querySelector('#store-err').textContent = t('ah_pub_store_failed');
        }
        btn.disabled = false;
      };
    });
  };

  const drawApps = () => {
    const installedView = _storeView === 'installed';
    const rows = (installedView ? apps.filter(a => a.installed)
                                : apps.filter(a => categoryOf(a) === _storeView))
                 .sort((a, b) => _appName(a).localeCompare(_appName(b)));
    drawRows(rows, installedView, installedView ? t('ah_pub_store_installed_title') : _catName(_storeView), true);
  };

  search.addEventListener('input', () => {
    const query = search.value.trim().toLocaleLowerCase();
    if (!query) { if (_storeView) drawApps(); else drawCategories(); return; }
    const rows = apps.filter(a => [_appName(a), a.description || '', _catName(categoryOf(a))]
      .some(value => value.toLocaleLowerCase().includes(query)))
      .sort((a, b) => _appName(a).localeCompare(_appName(b)));
    drawRows(rows, false, '', false);
  });

  if (_storeView) drawApps(); else drawCategories();
}

// ── Favourites tab ──────────────────────────────────────────────
// Favourites are the single shared list used by Game Hub and Chat —
// this is the one place to search for people and add/remove them.

let _favs = null; // cache

async function _loadFavs() {
  try {
    const r = await fetch(BASE + '/favourites', {headers:{'X-Pub-Token':_token}});
    _favs = r.ok ? await r.json() : [];
  } catch (_) {
    _favs = [];
  }
}
function _isFav(userId) { return !!(_favs && _favs.some(f=>f.id===userId)); }
async function _toggleFav(p) {
  const isFav = _isFav(p.id);
  await fetch(`${BASE}/favourites/${p.id}`, {method: isFav ? 'DELETE' : 'POST', headers:{'X-Pub-Token':_token}});
  if (isFav) { _favs = (_favs||[]).filter(f=>f.id!==p.id); }
  else { _favs = [p, ...(_favs||[]).filter(f=>f.id!==p.id)]; }
}

async function renderFavourites(c) {
  c.innerHTML = `<div class="section" style="display:flex;flex-direction:column;gap:14px;max-width:560px"><h2 style="font-size:1.1rem">${t('ah_pub_tab_favourites')}</h2></div>`;
  const sc = c.querySelector('.section');

  if (_favs === null) await _loadFavs();

  const searchWrap = document.createElement('div');
  searchWrap.innerHTML = `
    <div style="font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg2);margin-bottom:8px">${t('ah_find_people')}</div>
    <input class="inp" id="fav-search" placeholder="${t('ah_search_people_ph')}" autocomplete="off">
    <div id="fav-results" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>`;
  sc.appendChild(searchWrap);

  const resultsEl = searchWrap.querySelector('#fav-results');
  let _searchTimer = null;

  async function renderSearch(q) {
    resultsEl.innerHTML = '';
    if (q.length < 2) return;
    resultsEl.innerHTML = `<div style="color:var(--fg2);font-size:13px">${t('ah_searching')}</div>`;
    const r = await fetch(`${BASE}/search?q=${encodeURIComponent(q)}`);
    const hits = r.ok ? (await r.json()).filter(p => p.id !== _me?.id) : [];
    resultsEl.innerHTML = '';
    if (!hits.length) {
      resultsEl.innerHTML = `<div style="color:var(--fg2);font-size:13px">${t('ah_no_people_found')}</div>`;
      return;
    }
    hits.forEach(p => resultsEl.appendChild(_favRow(p, () => renderFavourites(c))));
  }

  searchWrap.querySelector('#fav-search').oninput = e => {
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(() => renderSearch(e.target.value.trim()), 300);
  };

  const divider = document.createElement('div');
  divider.style.cssText = 'border-top:1px solid var(--border);padding-top:14px';
  divider.innerHTML = `<div style="font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg2);margin-bottom:8px">${t('ah_saved_favourites')}</div>`;
  sc.appendChild(divider);

  const favsEl = document.createElement('div');
  favsEl.style.cssText = 'display:flex;flex-direction:column;gap:6px';
  divider.appendChild(favsEl);

  function renderSavedFavs() {
    favsEl.innerHTML = '';
    if (!_favs || !_favs.length) {
      favsEl.innerHTML = `<div style="color:var(--fg2);font-size:13px">${t('ah_no_favourites')}</div>`;
      return;
    }
    _favs.forEach(f => favsEl.appendChild(_favRow(f, renderSavedFavs)));
  }
  renderSavedFavs();
}

function _favRow(p, onFavChange) {
  const fav = _isFav(p.id);
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;align-items:center;gap:12px;justify-content:space-between';
  row.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
      ${renderAvatar(p, 32)}
      <div style="min-width:0">
        <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.display_name||p.username||'?')}</div>
        ${p.username?`<div style="font-size:11px;color:var(--fg2)">@${esc(p.username)}</div>`:''}
      </div>
    </div>
    <button class="btn btn-secondary" id="pr-fav" style="padding:5px 10px;font-size:12px;flex-shrink:0">${fav?t('ah_favourited'):t('ah_favourite')}</button>`;
  row.querySelector('#pr-fav').onclick = async () => {
    await _toggleFav(p);
    if (onFavChange) onFavChange();
  };
  return row;
}

// ── Profile tab ─────────────────────────────────────────────────

function _parseAvatarData(raw) {
  if (!raw) return null;
  if (typeof raw === 'string') { try { return JSON.parse(raw); } catch(e) { return null; } }
  return raw;
}

function renderProfile(c) {
  let _pendingAvatarData = _parseAvatarData(_me.avatar_data);

  c.innerHTML = `
    <div class="section" style="max-width:480px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;align-items:center;gap:14px">
        <div id="prof-av">${renderAvatar(_me, 54)}</div>
        <div>
          <div style="font-weight:700;font-size:1.1rem">${esc(_me.display_name)}</div>
          <div style="font-size:.85rem;color:var(--fg2)">@${esc(_me.username)}</div>
        </div>
      </div>
      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
        <div style="font-weight:600;font-size:13px">${t('ah_pub_edit_profile')}</div>
        <button class="btn btn-secondary" id="ef-avatar" style="display:flex;align-items:center;gap:10px;padding:8px 12px;font-weight:500;font-size:13px">
          <span id="ef-av-preview"></span>
          <span>${t('ah_pub_edit_avatar')}</span>
        </button>
        <input class="inp" id="ef-dname" placeholder="${t('ah_display_name_ph')}" value="${esc(_me.display_name)}">
        <input class="inp" id="ef-pass"  type="password" placeholder="${t('ah_pub_new_password_ph')}">
        <div class="err" id="ef-err"></div>
        <button class="btn btn-primary" id="ef-save">${t('ah_pub_save_changes')}</button>
      </div>
    </div>`;

  const updatePreview = () => {
    c.querySelector('#ef-av-preview').innerHTML = _pendingAvatarData
      ? GHAvatar.avatarSvg(_pendingAvatarData, 28)
      : renderAvatar(_me, 28);
    c.querySelector('#prof-av').innerHTML = _pendingAvatarData
      ? GHAvatar.avatarSvg(_pendingAvatarData, 54)
      : renderAvatar(_me, 54);
  };
  updatePreview();

  c.querySelector('#ef-avatar').onclick = () => {
    GHAvatar.showBuilder(_pendingAvatarData, _me.avatar_color, data => {
      _pendingAvatarData = _parseAvatarData(data);
      updatePreview();
    });
  };

  c.querySelector('#ef-save').onclick = async () => {
    const dn   = c.querySelector('#ef-dname').value.trim();
    const pw   = c.querySelector('#ef-pass').value;
    const errEl = c.querySelector('#ef-err');
    if (!dn) { errEl.textContent = t('ah_pub_display_name_required'); return; }
    c.querySelector('#ef-save').disabled = true;
    errEl.textContent = '';

    const svgStr = _pendingAvatarData ? GHAvatar.avatarSvg(_pendingAvatarData, 80) : null;
    const body = { display_name: dn, avatar_data: _pendingAvatarData ? JSON.stringify(_pendingAvatarData) : null, avatar_svg: svgStr };
    if (pw) body.password = pw;

    const r = await fetch(BASE + '/me', {
      method: 'PUT',
      headers: {'Content-Type':'application/json','X-Pub-Token':_token},
      body: JSON.stringify(body)
    });
    if (r.ok) {
      _me.display_name = dn;
      _me.avatar_data  = _pendingAvatarData;
      _me.avatar_svg   = svgStr;
      window.MvmLayout && MvmLayout.refresh();
      errEl.style.color = 'var(--green)';
      errEl.textContent = t('ah_pub_saved');
      setTimeout(() => { if(errEl) errEl.textContent=''; }, 2000);
    } else {
      const d = await r.json().catch(()=>({}));
      errEl.style.color = 'var(--red)';
      errEl.textContent = d.detail || t('ah_pub_error_saving');
    }
    c.querySelector('#ef-save').disabled = false;
  };
}

      </div>
      </div>
      <div data-sec="apps" style="display:flex;flex-direction:column;gap:20px">
        <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">

      </div>
      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
        <div style="font-weight:600;font-size:13px">${t('ah_pub_settings_date_format_label')}</div>
        <div id="st-date-format" style="display:flex;flex-wrap:wrap;gap:10px"></div>
      </div>
      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
        <div style="font-weight:600;font-size:13px">${t('ah_pub_settings_time_format_label')}</div>
        <div id="st-time-format" style="display:flex;flex-wrap:wrap;gap:10px"></div>
      </div>
      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
        <div style="font-weight:600;font-size:13px">${t('ah_pub_settings_currency_label')}</div>
        <select id="st-currency" style="padding:8px 10px;border-radius:8px;border:2px solid var(--border);background:var(--surface2);color:var(--fg)">
          <option value="">${esc(t('ah_pub_currency_system_default'))}</option>
          ${CURRENCIES.map(cur => `<option value="${cur}" ${currency===cur?'selected':''}>${cur}</option>`).join('')}
        </select>
      </div>
      <label class="card" style="padding:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer">
        <span><strong style="display:block;font-size:13px">${t('ah_pub_disable_software_keyboard')}</strong><small style="display:block;margin-top:4px;color:var(--fg2)">${t('ah_pub_per_device')}</small></span>
        <input id="st-disable-software-keyboard" type="checkbox" ${disableSoftwareKeyboard ? 'checked' : ''}>
      </label>
      </div>
      <div data-sec="sharing" style="display:flex;flex-direction:column;gap:20px">
        <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
          <div style="font-weight:600;font-size:13px">${t('feed_settings_audience')}</div>
          <div style="font-size:.8rem;color:var(--fg2)">${t('feed_settings_audience_hint')}</div>
          <div id="st-audience" style="display:flex;flex-direction:column;gap:8px"></div>
        </div>
      </div>
      ${_me.api ? '<div data-sec="api"><div class="card" style="padding:16px"><div id="api-tokens"></div></div></div>' : ''}
      <div class="err" id="st-err"></div>
    </div>`;

  let apiMounted = false;
  function showSection(id) {
    _settingsSection = id;
    c.querySelectorAll('.subtab').forEach(b => b.classList.toggle('active', b.dataset.sec === id));
    c.querySelectorAll('div[data-sec]').forEach(el => { el.style.display = el.dataset.sec === id ? 'flex' : 'none'; });
    c.firstElementChild.style.maxWidth = id === 'api' ? '1200px' : '480px';
    if (id === 'api' && !apiMounted) { apiMounted = true; _mountApiTokens(c.querySelector('#api-tokens')); }
  }
  c.querySelectorAll('.subtab').forEach(b => { b.onclick = () => showSection(b.dataset.sec); });
  showSection(_settingsSection);
  c.querySelector('#st-apps-sort').onchange = e => _setSortPref(e.target.value);

  // Who a new post is for unless chosen otherwise when writing it.
  const audWrap = c.querySelector('#st-audience');
  function renderAudience(current) {
    audWrap.innerHTML = [['favourites', '⭐', t('feed_aud_favourites'), t('feed_aud_favourites_hint')],
                         ['all', '🌍', t('feed_aud_all'), t('feed_aud_all_hint')]].map(([v, icon, label, hint]) => `
      <label class="aud-opt${current === v ? ' active' : ''}">
        <input type="radio" name="st-aud" value="${v}" ${current === v ? 'checked' : ''} style="margin-top:3px">
        <span><strong>${icon} ${esc(label)}</strong><small>${esc(hint)}</small></span>
      </label>`).join('');
    audWrap.querySelectorAll('input').forEach(inp => {
      inp.onchange = async () => {
        renderAudience(inp.value);
        const r = await fetch(BASE + '/feed/settings', {
          method: 'PUT', headers: {'Content-Type':'application/json','X-Pub-Token':_token},
          body: JSON.stringify({ audience: inp.value })
        }).catch(() => null);
        const errEl = c.querySelector('#st-err');
        if (errEl) errEl.textContent = r && r.ok ? '' : t('ah_pub_error_saving');
      };
    });
  }
  fetch(BASE + '/feed/settings', { headers: {'X-Pub-Token':_token} })
    .then(r => r.ok ? r.json() : { audience: 'favourites' })
    .then(d => renderAudience(d.audience))
    .catch(() => renderAudience('favourites'));

  const themeWrap = c.querySelector('#st-theme');
  const fontWrap  = c.querySelector('#st-font');
  const langWrap  = c.querySelector('#st-lang');
  const dateFormatWrap = c.querySelector('#st-date-format');
  const timeFormatWrap = c.querySelector('#st-time-format');
  const currencySelect = c.querySelector('#st-currency');
  currencySelect.onchange = () => { currency = currencySelect.value; save(); };
  c.querySelector('#st-disable-software-keyboard').addEventListener('change', event => {
    disableSoftwareKeyboard = event.target.checked;
    window.mvmOSKeyboardPreference?.setEnabled(disableSoftwareKeyboard);
  });

  function renderThemeSwatches() {
    themeWrap.innerHTML = THEME_SWATCHES.map(sw => `
      <button type="button" class="st-swatch" data-theme="${sw.id}" style="cursor:pointer;border-radius:10px;padding:0;overflow:hidden;
        border:2px solid ${theme===sw.id?'var(--accent)':'var(--border)'};background:${sw.bg};width:76px;height:56px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px" aria-label="${t(sw.label)}">
        <span style="font-weight:700;font-size:15px;color:${sw.fg}">Aa</span>
        <span style="width:20px;height:4px;border-radius:2px;background:${sw.accent}"></span>
        <span style="font-size:9px;line-height:1;background:rgba(24,24,37,.82);color:#fff;padding:2px 4px;border-radius:3px">${t(sw.label)}</span>
      </button>`).join('');
    themeWrap.querySelectorAll('.st-swatch').forEach(btn => {
      btn.onclick = () => { theme = btn.dataset.theme; renderThemeSwatches(); save(); };
    });
  }

  function renderFontButtons() {
    fontWrap.innerHTML = FONT_SIZES.map(sz => `
      <button type="button" class="st-font-btn" data-size="${sz}" style="cursor:pointer;flex:1 1 60px;border-radius:8px;padding:10px 4px;
        border:2px solid ${fontSize===sz?'var(--accent)':'var(--border)'};background:var(--surface2);color:var(--fg)">
        <span style="font-weight:700;font-size:${FONT_PREVIEW_PX[sz]}px">Aa</span>
      </button>`).join('');
    fontWrap.querySelectorAll('.st-font-btn').forEach(btn => {
      btn.onclick = () => { fontSize = btn.dataset.size; renderFontButtons(); save(); };
    });
  }

  function renderLangButtons() {
    langWrap.innerHTML = ['auto'].concat(availableLangs).map(code => `
      <button type="button" class="st-lang-btn" data-lang="${code}" style="cursor:pointer;border-radius:8px;padding:10px 16px;
        border:2px solid ${language===code?'var(--accent)':'var(--border)'};background:var(--surface2);color:var(--fg);font-size:13px;font-weight:600">
        ${code === 'auto' ? esc(t('ah_pub_settings_language_auto')) : esc(LANG_NAMES[code] || code)}
      </button>`).join('');
    langWrap.querySelectorAll('.st-lang-btn').forEach(btn => {
      btn.onclick = () => { language = btn.dataset.lang; renderLangButtons(); save(); };
    });
  }

  function renderDateFormatButtons() {
    const options = [
      { value: '', label: t('ah_pub_format_browser_default') },
      { value: 'DD/MM/YYYY', label: 'DD/MM/YYYY' },
      { value: 'MM/DD/YYYY', label: 'MM/DD/YYYY' },
      { value: 'YYYY-MM-DD', label: 'YYYY-MM-DD' },
    ];
    dateFormatWrap.innerHTML = options.map(o => `
      <button type="button" class="st-date-format-btn" data-value="${o.value}" style="cursor:pointer;border-radius:8px;padding:10px 16px;
        border:2px solid ${dateFormat===o.value?'var(--accent)':'var(--border)'};background:var(--surface2);color:var(--fg);font-size:13px;font-weight:600">
        ${esc(o.label)}
      </button>`).join('');
    dateFormatWrap.querySelectorAll('.st-date-format-btn').forEach(btn => {
      btn.onclick = () => { dateFormat = btn.dataset.value; renderDateFormatButtons(); save(); };
    });
  }

  function renderTimeFormatButtons() {
    const options = [
      { value: '', label: t('ah_pub_format_browser_default') },
      { value: '24', label: t('ah_pub_time_format_24') },
      { value: '12', label: t('ah_pub_time_format_12') },
    ];
    timeFormatWrap.innerHTML = options.map(o => `
      <button type="button" class="st-time-format-btn" data-value="${o.value}" style="cursor:pointer;border-radius:8px;padding:10px 16px;
        border:2px solid ${timeFormat===o.value?'var(--accent)':'var(--border)'};background:var(--surface2);color:var(--fg);font-size:13px;font-weight:600">
        ${esc(o.label)}
      </button>`).join('');
    timeFormatWrap.querySelectorAll('.st-time-format-btn').forEach(btn => {
      btn.onclick = () => { timeFormat = btn.dataset.value; renderTimeFormatButtons(); save(); };
    });
  }

  let _saving = false, _dirty = false;
  async function save() {
    // Applied to _me up front, not after the PUT answers: applyLanguage() below
    // ends in an 'i18n-loaded' event that re-runs showDashboard('settings'), and
    // a re-render that read the old _me.language would highlight the previous
    // language while the page was already showing the new one.
    _me.theme = theme; _me.font_size = fontSize; _me.language = language;
    _me.date_format = dateFormat; _me.time_format = timeFormat; _me.currency = currency;
    window.MvmLayout && MvmLayout.applyTheme(theme, fontSize);
    window.MvmLayout && MvmLayout.applyLanguage && MvmLayout.applyLanguage(language);
    // A click landing mid-save used to be applied on screen and then dropped;
    // remember it instead and send the latest state once the PUT in flight
    // returns, so what the server has always matches what is displayed.
    if (_saving) { _dirty = true; return; }
    _saving = true;
    const errEl = c.querySelector('#st-err');
    do {
      _dirty = false;
      const r = await fetch(BASE + '/me', {
        method: 'PUT',
        headers: {'Content-Type':'application/json','X-Pub-Token':_token},
        body: JSON.stringify({ theme, font_size: fontSize, language, date_format: dateFormat, time_format: timeFormat, currency })
      });
      if (!r.ok) {
        if (errEl) errEl.textContent = t('ah_pub_error_saving');
        break;
      }
    } while (_dirty);
    _saving = false;
  }

  renderThemeSwatches();
  renderFontButtons();
  renderLangButtons();
  renderDateFormatButtons();
  renderTimeFormatButtons();
}

// ── API (a section of Settings) ─────────────────────────────────

function _mountApiTokens(box) {
  const mount = () => ExtApiTokens.mount(box, { base: '/api/pub/extapi', headers: () => ({ 'X-Pub-Token': _token }) });
  if (window.ExtApiTokens) return mount();
  const s = document.createElement('script');
  s.src = window.asset('/pub/apphub/extapi-tokens.js');
  s.onload = mount;
  document.head.appendChild(s);
}

// ── Community tab ───────────────────────────────────────────────
// Posts the people on this server share with each other. The feed itself,
// and the composer every app page's header opens too, are in feed.js.

function _loadFeedJs() {
  if (window.MvmFeed) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = window.asset('/pub/apphub/feed.js');
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

function _setFeedDot(n) {
  _feedUnseen = n;
  const dot = app.querySelector('#feed-dot');
  if (dot) dot.hidden = !n || _activeTab === 'community';
}

async function _checkFeed() {
  if (!_token || document.hidden) return;
  try {
    const r = await fetch(BASE + '/feed/unseen', { headers: { 'X-Pub-Token': _token } });
    if (!r.ok) return;
    const n = (await r.json()).count || 0;
    if (_activeTab === 'community' && _feedView) _feedView.notifyNew(n);
    else _setFeedDot(n);
  } catch (_) {}
}

function _startFeedPoll() {
  if (_feedPoll) return;
  _checkFeed();
  _feedPoll = setInterval(_checkFeed, 60000);
  document.addEventListener('visibilitychange', _checkFeed);
}

async function renderCommunity(c) {
  c.innerHTML = '<div class="section"></div>';
  try { await _loadFeedJs(); } catch (_) { return; }
  if (_activeTab !== 'community' || !c.isConnected) return;
  _feedView = MvmFeed.mount(c.firstElementChild, { me: _me, onSeen: () => _setFeedDot(0) });
}

// ── Invitations tab ─────────────────────────────────────────────

async function renderInvitations(c, created) {
  c.innerHTML = `
    <div class="section" style="max-width:640px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px;font-size:.8rem;color:var(--fg2)">${esc(t('ah_invitations_page_hint'))}</div>
        <button class="btn btn-primary" id="inv-new">＋ ${esc(t('ah_invitation_new'))}</button>
      </div>
      <div id="inv-err" style="color:var(--red);font-size:.85rem" hidden></div>
      <div id="inv-list" style="display:flex;flex-direction:column;gap:8px">
        <div style="padding:20px;text-align:center;color:var(--fg2);font-size:.85rem">…</div>
      </div>
    </div>`;
  const err = c.querySelector('#inv-err');
  const showErr = msg => { err.textContent = msg; err.hidden = !msg; };

  c.querySelector('#inv-new').onclick = async e => {
    e.target.disabled = true; showErr('');
    try {
      const r = await fetch(BASE + '/invitations', {method:'POST', headers:{'X-Pub-Token':_token}});
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        // Say which refusal it was: one message for every failure made a
        // switched-off setting or a server error look like the 20 limit.
        showErr(d.detail === 'invitation_limit' ? t('ah_invitation_limit')
          : d.detail === 'invitations_disabled' ? t('ah_invitations_disabled')
          : t('ah_invitation_failed') + ' (' + r.status + ')');
        e.target.disabled = false;
        return;
      }
      renderInvitations(c, d.url);
    } catch (_) { showErr(t('ah_invitation_failed')); e.target.disabled = false; }
  };

  let rows = null;
  try {
    const r = await fetch(BASE + '/invitations', {headers:{'X-Pub-Token':_token}});
    if (r.ok) rows = await r.json();
  } catch (_) {}
  const list = c.querySelector('#inv-list');
  if (!rows) { list.innerHTML = ''; showErr(t('ah_invitations_load_failed')); return; }
  if (!rows.length) {
    list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--fg2);font-size:.85rem">${esc(t('ah_invitations_empty'))}</div>`;
    return;
  }
  const full = url => new URL(url, location.origin).href;
  list.innerHTML = rows.map(inv => {
    const who = inv.used_by ? (inv.used_by.display_name || inv.used_by.username) : '';
    const status = inv.used_at
      ? (who ? t('ah_invitation_accepted_by', {name: who, date: _fmtTime(inv.used_at)}) : t('ah_invitation_accepted', {date: _fmtTime(inv.used_at)}))
      : t('ah_invitation_waiting', {date: _fmtTime(inv.expires_at)});
    const fresh = created && inv.url === created;
    return `
    <div class="card" data-id="${esc(inv.id)}" data-used="${inv.used_at ? 1 : ''}" style="padding:12px 14px;display:flex;flex-direction:column;gap:8px${fresh ? ';border-color:var(--accent)' : ''}">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:1.1rem">${inv.used_at ? '✅' : '✉'}</span>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <div style="font-size:.85rem;font-weight:600;color:${inv.used_at ? 'var(--green)' : 'var(--fg)'}">${esc(status)}</div>
          <div style="font-size:.72rem;color:var(--fg2)">${esc(t('ah_invitation_created', {date: _fmtTime(inv.created_at)}))}</div>
        </div>
        <button class="btn btn-secondary inv-del" style="padding:6px 12px;font-size:.8rem" title="${esc(t('ah_invitation_delete'))}">🗑</button>
      </div>
      ${inv.url ? `
      <div style="display:flex;gap:6px">
        <input readonly value="${esc(full(inv.url))}" style="flex:1;min-width:0;font-size:.78rem;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--fg)">
        <button class="btn btn-secondary inv-copy" style="padding:6px 12px;font-size:.8rem;white-space:nowrap">${esc(t('ah_invitation_copy_link'))}</button>
      </div>` : !inv.used_at ? `<div style="font-size:.72rem;color:var(--fg2)">${esc(t('ah_invitation_link_unavailable'))}</div>` : ''}
    </div>`;
  }).join('');

  list.querySelectorAll('.inv-copy').forEach(btn => btn.onclick = async () => {
    const input = btn.previousElementSibling;
    try { await navigator.clipboard.writeText(input.value); }
    catch (_) { input.select(); document.execCommand('copy'); }
    btn.textContent = t('ah_invitation_copied');
    setTimeout(() => { btn.textContent = t('ah_invitation_copy_link'); }, 1500);
  });
  list.querySelectorAll('.inv-del').forEach(btn => btn.onclick = async () => {
    const card = btn.closest('.card');
    if (!confirm(t(card.dataset.used ? 'ah_invitation_delete_used_confirm' : 'ah_invitation_delete_confirm'))) return;
    btn.disabled = true;
    const r = await fetch(BASE + '/invitations/' + encodeURIComponent(card.dataset.id),
      {method:'DELETE', headers:{'X-Pub-Token':_token}}).catch(() => null);
    if (r && (r.ok || r.status === 404)) renderInvitations(c);
    else { btn.disabled = false; showErr(t('ah_invitation_delete_failed')); }
  });
}

// ── Credits tab ─────────────────────────────────────────────────

function _fmtTime(iso) {
  try { return new Date(iso).toLocaleString([], {dateStyle:'medium', timeStyle:'short', hour12:false}); }
  catch(_) { return iso; }
}

async function renderCredits(c) {
  c.innerHTML = `<div style="padding:32px;text-align:center;color:var(--fg2);font-size:.9rem">${t('ah_pub_loading_credits')}</div>`;
  let balance = 0, txs = [];
  try {
    const [rb, rt] = await Promise.all([
      fetch(BASE + '/credits', {headers:{'X-Pub-Token':_token}}),
      fetch(BASE + '/credits/transactions', {headers:{'X-Pub-Token':_token}}),
    ]);
    if (rb.ok) balance = (await rb.json()).balance;
    if (rt.ok) txs = await rt.json();
  } catch(_) {}

  c.innerHTML = `
    <div class="section" style="max-width:560px;display:flex;flex-direction:column;gap:14px">
      <div class="card" style="padding:20px;display:flex;flex-direction:column;align-items:center;gap:4px">
        <div style="font-size:.8rem;color:var(--fg2)">${t('ah_pub_your_balance')}</div>
        <div style="font-size:2.2rem;font-weight:700;color:var(--accent)">${balance}</div>
        <div style="font-size:.75rem;color:var(--fg2)">${t('ah_pub_credits_unit')}</div>
      </div>
      <div style="font-weight:600;font-size:13px">${t('ah_credits_history')}</div>
      <div id="cr-list" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>`;

  const list = c.querySelector('#cr-list');
  if (!txs.length) {
    list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--fg2);font-size:.85rem">${t('ah_credits_no_transactions')}</div>`;
    return;
  }
  list.innerHTML = txs.map(t => `
    <div class="card" style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <div style="font-size:.85rem;font-weight:600">${esc(t.reason || t.app_id)}</div>
        <div style="font-size:.72rem;color:var(--fg2)">${esc(t.app_id)} · ${_fmtTime(t.created_at)}</div>
      </div>
      <div style="font-size:.95rem;font-weight:700;color:${t.delta>=0?'var(--green)':'var(--red)'};flex-shrink:0">
        ${t.delta>=0?'+':''}${t.delta}
      </div>
    </div>`).join('');
}

// ── Avatar helper ───────────────────────────────────────────────

function renderAvatar(u, size) {
  if (u && u.avatar_svg) {
    return u.avatar_svg.replace(/width="\d+"/, `width="${size}"`).replace(/height="\d+"/, `height="${size}"`);
  }
  const color = esc(u?.avatar_color || '#585b70');
  const letter = esc((u?.display_name?.[0] || '?').toUpperCase());
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.45)}px;background:${color}">${letter}</div>`;
}

(window.mvmOS?.i18nReady || Promise.resolve()).then(boot);
