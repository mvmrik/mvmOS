<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mvmOS</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="mvmOS">
<link rel="apple-touch-icon" href="/favicon-192.png">
<link rel="stylesheet" href="/style.css?v=0.35.0">
<link id="theme-css" rel="stylesheet" href="/api/themes/active/css">
<link rel="stylesheet" href="/lib/xterm.css">
<script src="/keyboard-preference.js?v=0.35.0" data-mvm-keyboard-scope="system"></script>
</head>
<body class="splashing">

<!-- Splash screen -->
<div id="splash">
  <img src="/logo.png" alt="mvmOS">
  <div id="splash-bar"><div id="splash-progress"></div></div>
</div>

<!-- Desktop area -->
<div id="desktop"><div id="desktop-wallpaper"></div></div>

<!-- Taskbar -->
<div id="taskbar">
  <button id="start-btn">⊞</button>
  <div id="taskbar-windows"></div>
  <div id="taskbar-right">
    <div id="taskbar-tray"></div>
    <button id="notif-btn" type="button" title="Notifications" aria-label="Notifications" aria-expanded="false">
      <span id="notif-icon">🔔</span>
      <span id="notif-badge" style="display:none"></span>
    </button>
    <div id="clock"></div>
  </div>
  <div id="notif-panel" style="display:none"></div>
</div>

<!-- Start menu -->
<div id="start-menu">
  <div class="start-menu-user">
    <span class="start-menu-user-icon">👤</span>
    <span id="current-user-label">…</span>
    <button id="current-user-premium" type="button" style="display:none;margin-left:auto;align-items:center;gap:4px;background:rgba(137,180,250,.14);border:1px solid rgba(137,180,250,.38);border-radius:999px;padding:2px 7px;color:#89b4fa;font-size:.69rem;letter-spacing:.02em;cursor:pointer;font-family:inherit">💎 <span id="current-user-premium-label" data-i18n="start_premium">Premium</span></button>
  </div>
  <div class="start-menu-search-wrap">
    <input id="start-menu-search" class="start-menu-search" type="text" autocomplete="off" data-i18n-ph="search_placeholder" placeholder="Search…">
  </div>
  <div id="start-menu-results" style="display:none"></div>
  <div id="start-menu-main">
  <div id="start-menu-apps-anchor"></div>
  <div class="start-menu-sep"></div>
  </div>
  <div class="start-menu-sep"></div>
  <div class="start-menu-item" id="start-settings-btn">
    <span class="emoji">⚙️</span> <span data-i18n="app_settings">Settings</span>
  </div>
  <div class="start-menu-item" id="start-user-btn">
    <span class="emoji">👤</span> <span data-i18n="start_user">User</span>
    <span class="start-menu-item-arrow">›</span>
  </div>
  <div class="start-menu-item" id="start-power-btn">
    <span class="emoji">⏻</span> <span data-i18n="start_power">Power</span>
    <span class="start-menu-item-arrow">›</span>
  </div>
</div>

<!-- Taskbar context menu -->
<div id="taskbar-ctx-menu">
  <div class="ctx-item" id="tctx-widgets">🔲 Widgets</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" id="tctx-edit">✏️ Edit Widgets</div>
</div>

<!-- Right-click context menu -->
<div id="context-menu">
  <div class="ctx-item" id="ctx-paste" style="display:none">📋 <span data-i18n="ctx_paste">Paste</span></div>
  <div class="ctx-sep" id="ctx-paste-sep" style="display:none"></div>
  <div class="ctx-item" id="ctx-new-link">🔗 <span data-i18n="ctx_new_link">New Link</span></div>
  <div class="ctx-item" id="ctx-new-folder">📁 <span data-i18n="ctx_new_folder">New Folder</span></div>
  <div class="ctx-item" id="ctx-files">📁 <span data-i18n="ctx_open_files">Open Files</span></div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" id="ctx-widgets">🔲 <span data-i18n="ctx_widgets">Widgets</span></div>
  <div class="ctx-sep"></div>
  <div class="ctx-item ctx-danger" id="ctx-refresh">↺ <span data-i18n="ctx_refresh_desktop">Refresh Desktop</span></div>
</div>

<!-- New Link dialog -->
<div id="new-link-dialog" style="display:none;position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.5);align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;min-width:320px;box-shadow:var(--shadow);">
    <div style="font-weight:600;margin-bottom:14px;font-size:.95rem;">🔗 New Link</div>
    <input id="new-link-url" type="url" placeholder="https://example.com" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.85rem;padding:7px 10px;box-sizing:border-box;outline:none;margin-bottom:10px;">
    <input id="new-link-label" type="text" placeholder="Label (optional)" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.85rem;padding:7px 10px;box-sizing:border-box;outline:none;margin-bottom:14px;">
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="s-btn" id="new-link-cancel">Cancel</button>
      <button class="s-btn" id="new-link-ok" style="background:var(--accent);color:#fff;border-color:var(--accent);">Add</button>
    </div>
  </div>
</div>

<!-- ?v= is rewritten to each file's mtime by _versioned_html() in main.py,
     so edits are cache-busted automatically — no manual bump needed. -->
<script src="/i18n/i18n.js?v=0.18.2"></script>
<script src="/lib/xterm.js"></script>
<script src="/lib/xterm-addon-fit.js"></script>
<script src="/mvmos.js?v=0.18.2"></script>
<script src="/upload-manager.js?v=0.18.2"></script>
<script src="/settings.js?v=0.35.0"></script>
<script src="/appstore.js?v=0.35.0"></script>
<script src="/extensions.js?v=0.18.2"></script>
<script src="/desktop.js?v=0.35.0"></script>
<script src="/sites.js?v=0.18.2"></script>
<script src="/terminal.js?v=0.18.2"></script>
<script src="/mediaviewer.js?v=0.18.2"></script>
<script src="/filemanager.js?v=0.18.2"></script>
<script src="/startup-manager.js?v=0.18.2"></script>
<script src="/cron-manager.js?v=0.18.2"></script>
<script src="/apphub.js?v=0.18.2"></script>
<script src="/notifications.js?v=0.18.2"></script>
<script src="/codeeditor.js?v=0.18.2"></script>
<script src="/folderpicker.js?v=0.18.2"></script>
<script src="/gamelauncher.js?v=0.18.2"></script>
<script src="/screensaver.js?v=0.18.2"></script>
<script>ScreenSaver.init();</script>
<script src="/wallpaper.js?v=0.18.2"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
