<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="3">
<title>mvmOS — Restarting...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1b26; color: #c0caf5; font-family: system-ui, sans-serif;
         display: flex; align-items: center; justify-content: center; height: 100vh; }
  .box { text-align: center; }
  .logo { font-size: 3rem; margin-bottom: 16px; }
  h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
  p { font-size: .85rem; color: #565f89; }
  .dot { display: inline-block; animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .4s; }
  .dot:nth-child(3) { animation-delay: .8s; }
  @keyframes blink { 0%,80%,100% { opacity: 0; } 40% { opacity: 1; } }
</style>
</head>
<body>
<div class="box">
  <div class="logo">🖥️</div>
  <h1>mvmOS is restarting<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></h1>
  <p>The page will reload automatically.</p>
</div>
</body>
</html>
